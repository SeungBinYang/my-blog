title: 양승빈의 개발 일지
email: sbyang0731@gmail.com
author: 양승빈
github: https://github.com/SeungBinYang
description: >-
  개발을 공부하며 배운 내용과 겪은 문제, 그 해결 과정을 기록하는 개발 일지입니다.

baseurl: "/my-blog"
url: "https://seungbinyang.github.io"

excerpt_separator: "\n\n\n"

markdown: kramdown
kramdown:
  input: GFM

# Yat theme settings
# 전체 옵션은 https://github.com/jeffreytse/jekyll-theme-yat 참고
yat:
  date_format: "%Y-%m-%d"

# 헤더에 노출할 페이지 (순서대로)
header_pages:
  - archives.html
  - categories.html
  - tags.html
  - about.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
