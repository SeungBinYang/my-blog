title: 양승빈의 개발 일지
email: sbyang0731@gmail.com
author: 양승빈
github: https://github.com/SeungBinYang
description: >-
  개발을 공부하며 배운 내용과 겪은 문제, 그 해결 과정을 기록하는 개발 일지입니다.

baseurl: "/my-blog"
url: "https://seungbinyang.github.io"

excerpt_separator: "\n\n\n"

markdown: kramdown
kramdown:
  input: GFM

# Yat theme settings
# 전체 옵션은 https://github.com/jeffreytse/jekyll-theme-yat 참고
yat:
  date_format: "%Y-%m-%d"

# 헤더에 노출할 페이지 (순서대로)
header_pages:
  - archives.html
  - categories.html
  - tags.html
  - about.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

# 태그 상세 페이지(예: /tags/git/) 자동 생성
# slug_mode: raw -> 한글 태그(예: 버전관리)가 슬러그화 과정에서 깨지지 않도록 원문 그대로 사용
jekyll-archives:
  enabled:
    - tags
  layout: tag-archive
  slug_mode: raw
  permalinks:
    tag: "/tags/:name/"
